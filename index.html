<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8F6F3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0E1C" />
    <title>Gamut — Interactive Photo Analysis Lab</title>

    <!-- Prevent FOUC: apply a theme class before first paint. Gamut is
         dark-first (color-analysis accuracy): first visit defaults to
         dark; a saved explicit choice wins. -->
    <script>
      (function () {
        var saved = localStorage.getItem('gamut-theme');
        var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
